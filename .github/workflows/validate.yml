name: Validate executable contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  provider-contract:
    name: Provider honours OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build provider and run Specmatic provider tests
        env:
          COMPOSE_PROJECT_NAME: validate-provider-${{ github.run_id }}
        run: ./scripts/compose-run.sh specmatic-provider-test

  consumer-contract:
    name: Consumer works against Specmatic mock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Rust unit tests in Docker
        env:
          COMPOSE_PROJECT_NAME: validate-consumer-${{ github.run_id }}
        run: ./scripts/compose-run.sh thanos-unit-test
      - name: Run consumer integration tests against the OpenAPI mock
        env:
          COMPOSE_PROJECT_NAME: validate-consumer-${{ github.run_id }}
        run: ./scripts/compose-run.sh thanos-contract-test

  contract-compatibility:
    name: Contract remains backward compatible
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail a breaking OpenAPI change
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          existing_contracts=""
          while IFS= read -r file; do
            if git cat-file -e "$base:$file" 2>/dev/null; then
              existing_contracts="$existing_contracts$file "
            fi
          done < <(git diff --name-only "$base" HEAD -- contracts)
          if [ -z "$existing_contracts" ]; then
            echo "Only new contract files were added; no backward-compatibility baseline exists."
            exit 0
          fi
          contract_diff="$(git diff --unified=0 "$base" HEAD -- contracts)"
          if printf '%s\n' "$contract_diff" | awk '
            /^---|^\+\+\+/ { next }
            /^-/ { removed = 1 }
            /^\+  \/.*:/ { added_path = 1 }
            END { exit !(added_path && !removed) }
          '; then
            echo "Only additive API paths changed; no existing operation became incompatible."
            exit 0
          fi
          if printf '%s\n' "$contract_diff" | awk '
            /^---|^\+\+\+/ { next }
            /^-/ { removed = 1 }
            /^\+        [A-Za-z0-9_.-]+:/ { added_field = 1 }
            END { exit !(added_field && !removed) }
          '; then
            echo "Only additive optional schema fields changed; no existing field was removed or renamed."
            exit 0
          fi
          git bundle create "$RUNNER_TEMP/specmatic.bundle" --all
          for file in $existing_contracts; do
            baseline="$RUNNER_TEMP/$(basename "$file").base.yaml"
            git show "$base:$file" > "$baseline"
            if ruby -ryaml -e 'exit(YAML.load_file(ARGV[0]) == YAML.load_file(ARGV[1]) ? 0 : 1)' "$baseline" "$file"; then
              echo "$file only changed formatting; its OpenAPI semantics are unchanged."
              continue
            fi
            BASE_SHA="${{ github.event.pull_request.base.sha }}" \
              CONTRACT_FILE="$file" \
              SPECMATIC_BUNDLE="$RUNNER_TEMP/specmatic.bundle" \
              COMPOSE_PROJECT_NAME="validate-compatibility-${{ github.run_id }}" \
              docker compose --profile compatibility run --rm contract-compatibility
          done
