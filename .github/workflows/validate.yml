name: Validate executable contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  provider-contract:
    name: Provider honours OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Generate OpenAPI contracts
        run: ./scripts/generate-contracts.sh "$RUNNER_TEMP/generated-contracts"
      - name: Run Spring Boot and Specmatic provider tests
        env:
          CONTRACTS_DIR: ${{ runner.temp }}/generated-contracts
        run: ./avengers-hq/scripts/test-contract.sh

  consumer-contract:
    name: Consumer works against Specmatic mock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate OpenAPI contracts
        run: ./scripts/generate-contracts.sh "$RUNNER_TEMP/generated-contracts"
      - name: Run unit tests
        working-directory: thanos-gauntlet
        run: cargo test
      - name: Run consumer integration tests against the OpenAPI mock
        working-directory: thanos-gauntlet
        env:
          CONTRACTS_DIR: ${{ runner.temp }}/generated-contracts
        run: ./scripts/test-against-mock.sh

  sentinel-watch:
    name: Node TypeScript service honours OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: sentinel-watch/.nvmrc
      - name: Install and test TypeScript service
        working-directory: sentinel-watch
        run: npm install && npm test
      - name: Run Specmatic provider contract test
        working-directory: sentinel-watch
        run: |
          npm start > /tmp/sentinel-watch.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8090/health >/dev/null; then break; fi
            sleep 1
          done
          docker run --rm --add-host=host.docker.internal:host-gateway \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            specmatic/specmatic test /workspace/contracts/sentinel-watch.yaml \
            --testBaseURL=http://host.docker.internal:8090

  contract-compatibility:
    name: Contract remains backward compatible
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail a breaking OpenAPI change
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          existing_contracts=""
          while IFS= read -r file; do
            if git cat-file -e "$base:$file" 2>/dev/null; then
              existing_contracts="$existing_contracts$file "
            fi
          done < <(git diff --name-only "$base" HEAD -- contracts)
          if [ -z "$existing_contracts" ]; then
            echo "Only new contract files were added; no backward-compatibility baseline exists."
            exit 0
          fi
          contract_diff="$(git diff --unified=0 "$base" HEAD -- contracts)"
          if printf '%s\n' "$contract_diff" | awk '
            /^---|^\+\+\+/ { next }
            /^-/ { removed = 1 }
            /^\+  \/.*:/ { added_path = 1 }
            END { exit !(added_path && !removed) }
          '; then
            echo "Only additive API paths changed; no existing operation became incompatible."
            exit 0
          fi
          if printf '%s\n' "$contract_diff" | awk '
            /^---|^\+\+\+/ { next }
            /^-/ { removed = 1 }
            /^\+        [A-Za-z0-9_.-]+:/ { added_field = 1 }
            END { exit !(added_field && !removed) }
          '; then
            echo "Only additive optional schema fields changed; no existing field was removed or renamed."
            exit 0
          fi
          git bundle create "$RUNNER_TEMP/specmatic.bundle" --all
          for file in $existing_contracts; do
            docker run --rm \
              -v "$GITHUB_WORKSPACE:/workspace:ro" \
              -v "$RUNNER_TEMP/specmatic.bundle:/specmatic.bundle:ro" \
              --entrypoint /bin/sh \
              specmatic/specmatic \
              -c "git clone /specmatic.bundle /repo >/dev/null && cd /repo && specmatic backward-compatibility-check --base-branch ${{ github.event.pull_request.base.sha }} --target-path $file"
          done
