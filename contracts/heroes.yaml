openapi: 3.0.3
info:
  title: Avengers HQ Superhero Registry
  description: |
    Executable contract shared by Avengers HQ (provider) and Thanos Gauntlet
    (consumer). Specmatic uses it both to test the real provider and to run a
    mock that the consumer tests call.
  version: "1.0.0"
servers:
  - url: http://localhost:8080
    description: Local Avengers HQ
paths:
  /heroes/{id}:
    get:
      operationId: getHeroById
      summary: Retrieve a registered Avenger by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          examples:
            IRON_MAN_200_OK:
              value: 1
            THOR_200_OK:
              value: 2
            UNKNOWN_HERO_404:
              value: 666
      responses:
        "200":
          description: Hero found in the registry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hero"
              examples:
                IRON_MAN_200_OK:
                  value:
                    id: 1
                    name: Tony Stark
                    alias: Iron Man
                    strength: 95
                    infinityStoneStatus: SECURED
                    location: Avengers Tower
                THOR_200_OK:
                  value:
                    id: 2
                    name: Thor Odinson
                    alias: God of Thunder
                    strength: 99
                    infinityStoneStatus: SECURED
                    location: New Asgard
        "404":
          description: Hero not found — perhaps dusted, or never assembled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UNKNOWN_HERO_404:
                  value:
                    status: 404
                    message: Hero not found
                    path: /heroes/666
components:
  schemas:
    Hero:
      type: object
      additionalProperties: false
      required: [id, name, alias, strength, infinityStoneStatus]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        alias:
          type: string
        strength:
          type: integer
          minimum: 0
          maximum: 100
          description: SHIELD-rated combat power. This renamed field intentionally breaks compatibility.
        infinityStoneStatus:
          $ref: "#/components/schemas/InfinityStoneStatus"
        location:
          type: string
          description: Optional last-known location.
    InfinityStoneStatus:
      type: string
      enum: [SECURED, MISSING, COMPROMISED]
    Error:
      type: object
      additionalProperties: false
      required: [status, message]
      properties:
        status:
          type: integer
        message:
          type: string
        path:
          type: string
