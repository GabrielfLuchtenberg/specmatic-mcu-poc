---
openapi: "3.1.0"
info:
  title: "Avengers HQ Superhero Registry"
  description: "Executable contract shared by Avengers HQ (provider) and Thanos Gauntlet\n\
    (consumer). Specmatic uses it both to test the real provider and to run a\nmock\
    \ that the consumer tests call."
  version: "1.0.0"
servers:
- url: "http://localhost:8080"
  description: "Local Avengers HQ"
paths:
  /heroes/{id}:
    get:
      tags:
      - "hero-controller"
      summary: "Retrieve a registered Avenger by id"
      operationId: "getHeroById"
      parameters:
      - name: "id"
        in: "path"
        description: "Registered hero id"
        required: true
        schema:
          type: "integer"
          format: "int64"
          minimum: 1
        examples:
          IRON_MAN_200_OK:
            value: 1
          THOR_200_OK:
            value: 2
          UNKNOWN_HERO_404:
            value: 666
        example: 1
      responses:
        "200":
          description: "Hero found in the registry"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hero"
              examples:
                IRON_MAN_200_OK:
                  value:
                    id: 1
                    name: "Tony Stark"
                    alias: "Iron Man"
                    powerLevel: 95
                    infinityStoneStatus: "SECURED"
                    location: "Avengers Tower"
                THOR_200_OK:
                  value:
                    id: 2
                    name: "Thor Odinson"
                    alias: "God of Thunder"
                    powerLevel: 99
                    infinityStoneStatus: "SECURED"
                    location: "New Asgard"
        "404":
          description: "Hero not found — perhaps dusted, or never assembled"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UNKNOWN_HERO_404:
                  value:
                    status: 404
                    message: "Hero not found"
                    path: "/heroes/666"
components:
  schemas:
    Hero:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "integer"
          format: "int64"
        name:
          type: "string"
        alias:
          type: "string"
        powerLevel:
          type: "integer"
          format: "int32"
          description: "SHIELD-rated combat power. Renaming this field is a breaking\
            \ change."
          maximum: 100
          minimum: 0
        infinityStoneStatus:
          $ref: "#/components/schemas/InfinityStoneStatus"
        location:
          type: "string"
          description: "Optional last-known location."
      required:
      - "alias"
      - "id"
      - "infinityStoneStatus"
      - "name"
      - "powerLevel"
    InfinityStoneStatus:
      type: "string"
      enum:
      - "SECURED"
      - "MISSING"
      - "COMPROMISED"
    Error:
      type: "object"
      additionalProperties: false
      properties:
        status:
          type: "integer"
          format: "int32"
        message:
          type: "string"
        path:
          type: "string"
      required:
      - "message"
      - "status"
